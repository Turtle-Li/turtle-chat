name: Turtle public build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: turtle-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: turtle_test
          POSTGRES_PASSWORD: turtle_test_password
          POSTGRES_DB: turtle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turtle_test -d turtle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Python tests
        env:
          PROJECT_USAGE_TEST_DATABASE_URL: postgresql://turtle_test:turtle_test_password@127.0.0.1:5432/turtle_test
        run: uv run --extra test --extra claude pytest -q
      - name: Frontend syntax and cache tests
        run: |
          node --check branding/open-webui/client-read-cache.js
          node --check branding/open-webui/model-controls.js
          node --check branding/open-webui/storage-controls.js
          node --check branding/open-webui/admin-console.js
          node --check branding/open-webui/project-api.js
          node --test tests/js/client-read-cache.test.mjs
      - name: Deployment syntax
        env:
          GATEWAY_API_KEY: syntax-only
          UPSTREAM_API_KEY: syntax-only
          WEBUI_SECRET_KEY: syntax-only
          FORWARD_USER_INFO_HEADER_JWT_SECRET: syntax-only
          GATEWAY_BLUE_IMAGE: syntax-only
          OPEN_WEBUI_BLUE_IMAGE: syntax-only
          GATEWAY_GREEN_IMAGE: syntax-only
          OPEN_WEBUI_GREEN_IMAGE: syntax-only
        run: |
          bash -n deploy/turtle-gpt/remote/deploy-release
          bash -n deploy/turtle-gpt/remote/stop-inactive-slot
          bash -n deploy/turtle-gpt/remote/turtle-gpt-deploy-entry
          docker compose -f deploy/turtle-gpt/compose.blue-green.yml config --quiet

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            image: ghcr.io/turtle-li/turtle-chat-gateway
            context: .
            dockerfile: ./Dockerfile
          - name: open-webui
            image: ghcr.io/turtle-li/turtle-chat-open-webui
            context: ./branding/open-webui
            dockerfile: ./branding/open-webui/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:git-${{ github.sha }}
            ${{ matrix.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Turtle's Chat ${{ matrix.name }}
          provenance: false
